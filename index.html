<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GATHER — Menu</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
--bg:#fff;--ink:#4a5528;--muted:#85906a;--line:#eef1e4;--accent:#7a8c45;--on:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;padding:20px 16px 120px}
.wrap{max-width:480px;margin:0 auto}
.logo{display:block;width:170px;max-width:60%;margin:0 auto}
.tag{text-align:center;color:var(--muted);font-family:Georgia,serif;font-style:italic;font-size:14px;margin:6px 0 22px}
h2{font-family:Georgia,serif;font-weight:400;letter-spacing:.2em;font-size:13px;color:var(--muted);text-transform:uppercase;margin:24px 0 8px}
.item{padding:16px 0;border-bottom:1px solid var(--line)}
.foot{text-align:center;color:var(--muted);font-family:Georgia,serif;font-style:italic;font-size:14px;margin:40px 0 0}
.foot strong{display:block;font-style:normal;font-weight:400;color:var(--accent);font-size:22px;letter-spacing:.3em;text-transform:uppercase;margin-top:4px}
.send.wa{background:#fff;color:var(--accent);border:1.5px solid var(--accent);padding:13.5px}
.send+.send{margin-top:12px}
.hint2{text-align:center;color:var(--muted);font-size:13px;margin:12px 0 0}
.locbtn{margin-top:8px;padding:10px 14px;border-radius:10px;border:1px solid var(--accent);background:#fff;color:var(--accent);font-size:14px;font-family:inherit;cursor:pointer}
.locst{font-size:13px;color:var(--muted);margin-top:6px;min-height:16px}
.back{border:0;background:none;color:var(--accent);font-size:15px;font-weight:600;padding:4px 0 0;cursor:pointer;font-family:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tile{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;cursor:pointer;font-family:inherit;color:var(--ink)}
.tile .ph{width:72px;height:72px}
.tile .ph svg{width:54px;height:54px}
.tile b{font-size:14px;text-align:center;line-height:1.25}
.tile small{color:var(--accent);font-size:12px;font-weight:600}
.fz{font-size:12px;letter-spacing:.08em;color:rgba(110,110,110,.5)}
.badge{position:absolute;top:8px;right:8px;min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:10;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0;font-size:17px;line-height:1.2}
.sheet .fz{display:block;margin-top:2px;line-height:1.1}
.hint{color:var(--muted);font-size:13px;margin:14px 0 0}
.olg{font-size:17px;font-weight:600}
button.send{width:100%;border:0;cursor:pointer;font-family:inherit}
.head{display:flex;align-items:center;gap:12px}
.ph{width:64px;height:64px;flex:none;border-radius:14px;background:#f6f8ee;display:flex;align-items:center;justify-content:center}
.ph svg{width:46px;height:46px;stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 0}
.ol{font-size:14px;color:var(--muted)}
.item h3{margin:0;font-size:16px;font-weight:600}
.item p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.price{font-size:14px;margin-top:4px;color:var(--accent);font-weight:600}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--accent);background:#fff;color:var(--accent);font-size:20px;line-height:1;cursor:pointer}
.qty button.add{background:var(--accent);color:var(--on)}
.qty span{min-width:20px;text-align:center;font-weight:600}
.box{border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-top:8px}
.line{display:flex;justify-content:space-between;padding:9px 0;font-size:15px}
.line.t{border-top:2px solid var(--accent);margin-top:6px;font-weight:700;font-size:18px}
.line.m{color:var(--muted);font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 5px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;font-family:inherit;color:var(--ink);background:#fff}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.send{display:block;text-align:center;text-decoration:none;margin-top:20px;padding:15px;border-radius:12px;background:var(--accent);color:var(--on);font-size:16px;font-weight:600}
.send.off{opacity:.45}
.err{color:#b3402a;font-size:13px;text-align:center;margin-top:8px;min-height:18px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line);display:none}
.bar.show{display:block}
.bar a{display:flex;justify-content:space-between;max-width:480px;margin:0 auto;padding:14px 18px;border-radius:12px;background:var(--accent);color:var(--on);text-decoration:none;font-weight:600}
</style>
</head>

  <div style="height:18px"></div>

  <div id="p1"><h2>Menu</h2>
  <div id="menu"></div></div>
  <div id="p2" style="display:none"><button class="back" id="back">← Back to menu</button>

  <h2 id="order">Your Order</h2>
  <div class="box" id="summary"></div>

  <label for="name">Name</label><input id="name" autocomplete="name">
  <label for="phone">Phone</label><input id="phone" type="tel" autocomplete="tel">
  <label for="area">Delivery area</label><select id="area"></select>
    <label for="notes">Notes (optional)</label><textarea id="notes" rows="2"></textarea>

  <a class="send off" id="send" target="_blank" rel="noopener">Send order to WhatsApp</a>
  <div class="err" id="err"></div>
</div>
  <p class="foot">Good food brings us to<strong>Gather</strong></p>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="bar" id="bar"><a href="#" id="go"><span id="bcount"></span><span id="btotal"></span></a></div>

<script>
// ✏️ عدّل هنا: رقم الواتساب (بدون + وبدون أصفار) والمنيو والتوصيل
var WHATSAPP="971543904004";
var AREAS=[["Sharjah",20],["Ajman",30],["Dubai",35],["Ras Al Khaimah",50],["Abu Dhabi",50],["Al Ain",50],["Khorfakkan",50],["Kalba",50],["Fujairah",50]];
function fee(){var v=$("area").value;return v===""?null:AREAS[+v][1]}
var ICON={
 hot:'<svg viewBox="0 0 64 64"><g transform="rotate(-28 32 34)"><rect x="8" y="23" width="44" height="22" rx="11"/><ellipse cx="49" cy="34" rx="4" ry="11"/><ellipse cx="49" cy="34" rx="1.5" ry="4.5"/><path d="M18 28v12M27 27v14M36 27v14"/></g></svg>',
 chz:'<svg viewBox="0 0 64 64"><g transform="rotate(-28 32 34)"><rect x="8" y="23" width="44" height="22" rx="11"/><ellipse cx="49" cy="34" rx="4" ry="11"/><path d="M18 28v12M27 27v14M36 27v14"/></g><circle cx="20" cy="11" r="3"/><circle cx="32" cy="8" r="3"/><circle cx="44" cy="11" r="3"/></svg>',
 sam:'<svg viewBox="0 0 64 64"><path d="M32 9L57 52H7z"/><path d="M12 45h40M32 24l11 21M32 24L21 45"/></svg>'
};
var MENU=[
  {ic:"hot",name:"Hotdog Spring Roll",opts:[{l:"40 pieces",p:120},{l:"70 pieces",p:210}]},
  {ic:"chz",name:"Three Cheese Spring Roll",opts:[{l:"40 pieces",p:120},{l:"70 pieces",p:210}]},
  {ic:"sam",name:"Sambosa Tikka Lumee",opts:[{l:"30 pieces",p:90},{l:"50 pieces",p:150}]}
];
var FLAT=[];MENU.forEach(function(m,i){m.opts.forEach(function(o,j){FLAT.push({id:i+"_"+j,name:m.name,label:o.l,price:o.p})})});
var qty={};var view=1;
var $=function(i){return document.getElementById(i)};
function aed(n){return "AED "+n}
function btn(txt,cls,fn,al){var b=document.createElement("button");b.textContent=txt;if(cls)b.className=cls;b.setAttribute("aria-label",al);b.onclick=fn;return b}
var openIdx=null;
function renderMenu(){
  var m=$("menu");m.innerHTML="";m.className="grid";
  MENU.forEach(function(it,i){
    var tile=document.createElement("button");tile.className="tile";tile.setAttribute("aria-label",it.name);
    var ph=document.createElement("div");ph.className="ph";ph.innerHTML=ICON[it.ic];
    var b=document.createElement("b");b.textContent=it.name;
    var sm=document.createElement("small");sm.textContent="From "+aed(Math.min.apply(null,it.opts.map(function(o){return o.p})));
    var fz=document.createElement("span");fz.className="fz";fz.textContent="Frozen";
    tile.appendChild(ph);tile.appendChild(b);tile.appendChild(fz);tile.appendChild(sm);
    var n=0;it.opts.forEach(function(o,j){n+=qty[i+"_"+j]||0});
    if(n){var bd=document.createElement("span");bd.className="badge";bd.textContent=n;tile.appendChild(bd)}
    tile.onclick=function(){openIdx=i;renderModal()};
    m.appendChild(tile);
  });
}
function renderModal(){
  var md=$("modal");
  if(openIdx===null){md.className="modal";return}
  var it=MENU[openIdx],sh=$("sheet");sh.innerHTML="";md.className="modal open";
  var hd=document.createElement("div");hd.className="head";
  var ph=document.createElement("div");ph.className="ph";ph.innerHTML=ICON[it.ic];
  var h=document.createElement("h3");h.textContent=it.name;
  var tw=document.createElement("div");tw.appendChild(h);
  var fz=document.createElement("span");fz.className="fz";fz.textContent="Frozen";tw.appendChild(fz);
  hd.appendChild(ph);hd.appendChild(tw);sh.appendChild(hd);
  var q0=document.createElement("p");q0.className="hint";q0.textContent="Choose how many pieces";sh.appendChild(q0);
  it.opts.forEach(function(o,j){
    var id=openIdx+"_"+j,q=qty[id]||0;
    var r=document.createElement("div");r.className="opt";
    var l=document.createElement("div");
    var a=document.createElement("div");a.textContent=o.l;a.className="olg";
    var pr=document.createElement("div");pr.className="price";pr.textContent=aed(o.p);
    l.appendChild(a);l.appendChild(pr);
    var c=document.createElement("div");c.className="qty";
    if(q>0){c.appendChild(btn("−","",function(){change(id,-1)},"Remove one"));var s=document.createElement("span");s.textContent=q;c.appendChild(s)}
    c.appendChild(btn("+","add",function(){change(id,1)},"Add one"));
    r.appendChild(l);r.appendChild(c);sh.appendChild(r);
  });
  var d=document.createElement("button");d.className="send";d.textContent="Done";d.onclick=function(){openIdx=null;renderModal()};sh.appendChild(d);
}
function change(id,n){qty[id]=Math.max(0,(qty[id]||0)+n);update()}
function totals(){var s=0,c=0,lines=[];FLAT.forEach(function(it){var q=qty[it.id]||0;if(q){s+=q*it.price;c+=q;lines.push({it:it,q:q})}});return{s:s,c:c,lines:lines}}
function update(){
  renderMenu();renderModal();
  var t=totals(),box=$("summary");box.innerHTML="";
  if(!t.c){box.innerHTML='<div class="empty">No items yet — add something from the menu.</div>'}
  else{
    t.lines.forEach(function(x){row(box,x.q+" × "+x.it.name+" ("+x.it.label+")",aed(x.q*x.it.price),"")});
    row(box,"Subtotal",aed(t.s),"m");var f=fee();row(box,"Delivery",f===null?"Select area":aed(f),"m");row(box,"Total",aed(t.s+(f||0)),"t");
  }
  $("order").style.display=t.c?"":"none";box.style.display=t.c?"":"none";
  var bar=$("bar");bar.className="bar"+(t.c&&view===1?" show":"");
  $("bcount").textContent="Checkout ("+t.c+")";$("btotal").textContent=aed(t.s+(fee()||0));
  link();
}
function row(box,a,b,cls){var d=document.createElement("div");d.className="line "+cls;var x=document.createElement("span");x.textContent=a;var y=document.createElement("span");y.textContent=b;d.appendChild(x);d.appendChild(y);box.appendChild(d)}
function link(){
  var t=totals(),n=$("name").value.trim(),p=$("phone").value.trim(),no=$("notes").value.trim();
  var ar=$("area").value!==""?AREAS[+$("area").value][0]:"";
  var ok=t.c&&n&&p&&ar,s=$("send");
  s.className="send"+(ok?"":" off");
  if(!ok){s.removeAttribute("href");return}
  var m="*New order — GATHER*\n\nName: "+n+"\nPhone: "+p+"\nArea: "+ar+"\n\n";
  t.lines.forEach(function(x){m+=x.q+" × "+x.it.name+" ("+x.it.label+") — "+aed(x.q*x.it.price)+"\n"});
  m+="\nSubtotal: "+aed(t.s)+"\nDelivery: "+aed(fee())+"\n*Total: "+aed(t.s+fee())+"*";
  if(no)m+="\n\nNotes: "+no;
  s.href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(m);
}
$("send").addEventListener("click",function(e){
  if(!this.getAttribute("href")){e.preventDefault();
    $("err").textContent=!totals().c?"Please add at least one item.":"Please fill in name, phone and delivery area."}
  else $("err").textContent="";
});
var sel=$("area");sel.innerHTML='<option value="">Select area</option>';
AREAS.forEach(function(a,i){var o=document.createElement("option");o.value=i;o.textContent=a[0];sel.appendChild(o)});
sel.addEventListener("change",update);
["name","phone","notes"].forEach(function(i){$(i).addEventListener("input",link)});
$("modal").addEventListener("click",function(e){if(e.target===$("modal")){openIdx=null;renderModal()}});
function showView(n){view=n;$("p1").style.display=n===1?"":"none";$("p2").style.display=n===2?"":"none";update();window.scrollTo(0,0)}
$("go").addEventListener("click",function(e){e.preventDefault();showView(2)});
$("back").addEventListener("click",function(){showView(1)});
update();
</script>
</body>
