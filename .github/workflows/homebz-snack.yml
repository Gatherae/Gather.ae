name: Homebz – Snack link

on:
  workflow_dispatch:
  push:
    branches: [homebz-expo-app]
    paths: ['homebz-app/web-app/**', 'homebz-app/snack/**', 'homebz-app/scripts/save-snack.js', '.github/workflows/homebz-snack.yml']

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homebz-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Probe Snack runtimes
        run: |
          for v in 52 53 54 55 56 57 58; do for p in ios android; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -H "expo-platform: $p" -H "expo-runtime-version: exposdk:$v.0.0" -H 'expo-channel-name: production' -H 'accept: multipart/mixed,application/expo+json,application/json' "https://u.expo.dev/933fd9c0-1666-11e7-afca-d980795c5824?runtime-version=exposdk:$v.0.0&channel-name=production")
            echo "SDK $v $p: $c" | tee -a probe.txt
          done; done
      - run: node scripts/save-snack.js 57.0.0
      - name: Probe web app hosting
        if: always()
        run: |
          for u in "https://rawcdn.githack.com/Gatherae/Gather.ae/${{ github.sha }}/homebz-app/web-app/index.html" "https://raw.githack.com/Gatherae/Gather.ae/homebz-expo-app/homebz-app/web-app/index.html" "https://rawcdn.githack.com/Gatherae/Gather.ae/${{ github.sha }}/homebz-app/web-app/icon.png"; do
            echo "WEB $(curl -s -o /dev/null -L -w '%{http_code} %{content_type} %{size_download}' "$u") $u" | tee -a probe.txt
          done
      - name: Publish link
        if: always()
        run: |
          [ -f snack-link.txt ] || echo "FAILED" > snack-link.txt
          cat probe.txt >> snack-link.txt || true
          cp snack-link.txt "$RUNNER_TEMP/snack-link.txt"
          cd "$RUNNER_TEMP" && rm -rf link && git init -q link && cd link
          cp ../snack-link.txt .
          git checkout -q -b homebz-snack-link
          git add snack-link.txt && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Snack link"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" homebz-snack-link
